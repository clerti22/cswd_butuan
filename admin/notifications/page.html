<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCIMS Notifications</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="overlay" id="overlay"></div>

  <div class="container">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
          <img src="../images-logo/cswd-logo.png" alt="" width="130" height="110">
          <p class="sidebar-title">CCIMS Dashboard</p>
          <button class="close-btn" id="closeSidebar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
          </button>
      </div>
      <div class="user-info">
          <p class="user-name">Benjamin Scott</p>
          <p class="user-role">Admin</p>
          <p class="user-division">PSSD</p>
      </div>
    </nav>

    <div class="main-content">
      <header class="topbar">
        <button class="menu-btn" id="openSidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <h2 class="topbar-title" style="font-weight: bold;">Notifications</h2>
      </header>

      <main class="content">
        <section class="section">
          <div class="notifications-panel">
            <div class="panel-head-row">
              <div>
                <h1 class="page-title">Notifications Feed</h1>
                <p class="page-subtitle">Division-scoped notification logs from user activity.</p>
              </div>
              <span class="total-badge" id="notificationTotal">0 total</span>
            </div>
            <div class="notification-groups" id="notificationGroups"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="index.js"></script>
</body>

</html>
