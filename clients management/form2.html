<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 2 - Family Composition</title>
    <link rel="stylesheet" href="form2.css">
</head>

<body>
    <main class="form-page">
        <section class="section">
            <div class="section-title">
                <span class="title-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M7 2h10a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3Zm0 2a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H7Zm2 4h6v2H9V8Zm0 4h6v2H9v-2Z" />
                    </svg>
                </span>
                <h2>Family Composition</h2>
            </div>

            <div class="table-card">
                <div class="table-header">
                    <span>Name</span>
                    <span>Relationship</span>
                    <span>Gender</span>
                    <span>Age</span>
                    <span>Grade Yr.</span>
                    <span>ISY</span>
                    <span>OSY</span>
                    <span>Work/Labor Experience</span>
                    <span>Income</span>
                </div>
                <div class="table-row">
                    <input type="text" placeholder="Name">
                    <input type="text" placeholder="Relationship">
                    <input type="text" placeholder="Gender">
                    <input type="text" placeholder="Age">
                    <input type="text" placeholder="Grade Yr.">
                    <input type="text" placeholder="ISY">
                    <input type="text" placeholder="OSY">
                    <input type="text" placeholder="Work/Labor Experience">
                    <input type="text" placeholder="Income">
                </div>
            </div>

            <button class="add-button" type="button">
                <span class="button-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 5a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H6a1 1 0 1 1 0-2h5V6a1 1 0 0 1 1-1Z" />
                    </svg>
                </span>
                Add
            </button>
        </section>

        <section class="section">
            <div class="section-title">
                <span class="title-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z" />
                    </svg>
                </span>
                <h2>Assistance &amp; Intervention Received from CSWD &amp; other Agencies:</h2>
            </div>

            <div class="checkbox-grid">
                <label><input type="checkbox"> Social Amelioration Program (SAP)</label>
                <label><input type="checkbox"> Food Subsidy</label>
                <label><input type="checkbox"> Summer Job</label>
                <label><input type="checkbox"> Teenage Pregnancy</label>
                <label><input type="checkbox"> Drug Awareness</label>
                <label><input type="checkbox"> Government Outreach Program</label>
                <label><input type="checkbox"> Livelihood Program</label>
                <label><input type="checkbox"> Internship Outreach Program</label>
                <label><input type="checkbox"> Mental Health Awareness</label>
                <label><input type="checkbox"> Mental Health Awareness</label>
                <label><input type="checkbox"> Leadership Training</label>
            </div>

            <div class="specify">
                <label for="assist-specify">Please Specify:</label>
                <input id="assist-specify" type="text">
            </div>
        </section>

        <section class="section">
            <div class="section-title">
                <span class="title-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z" />
                    </svg>
                </span>
                <h2>Intervention needed:</h2>
            </div>

            <div class="checkbox-grid two-columns">
                <label><input type="checkbox"> Skills Training</label>
                <label><input type="checkbox"> Livelihood</label>
            </div>

            <div class="specify">
                <label for="intervention-specify">Please Specify:</label>
                <input id="intervention-specify" type="text">
            </div>
        </section>
    </main>
</body>

</html>
