<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCIMS Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <nav class="sidebar" id="sidebar"></nav>

        <div class="main-content">
            <header class="topbar">
                <button class="menu-btn" id="openSidebar" aria-label="Open menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h3 class="topbar-title">Super Admin Profile</h3>
            </header>

            <main class="form-page">
                <div class="profile-layout">
                    <section class="profile-card" aria-labelledby="personal-info-title">
                        <div class="section-header">
                            <div>
                                <p class="section-eyebrow">Account settings</p>
                                <h2 id="personal-info-title">Personal Information</h2>
                                <p class="section-description">Review and update your profile details. Required fields are marked with <span class="required-mark">*</span>.</p>
                            </div>
                            <div class="section-actions" id="profileActions">
                                <button id="edit-button" class="action-button primary" type="button">Edit</button>
                                <button id="save-button" class="action-button success hidden" type="button">Save Changes</button>
                                <button id="cancel-button" class="action-button secondary hidden" type="button">Cancel</button>
                            </div>
                        </div>

                        <div id="profileAlert" class="form-alert hidden" role="alert"></div>

                        <form id="profileForm" class="profile-form" novalidate>
                            <div class="profile-grid">
                                <div class="profile-field">
                                    <label for="full_name">Full Name <span class="required-mark">*</span></label>
                                    <input type="text" id="full_name" name="full_name" readonly required>
                                    <p class="field-error" data-error-for="full_name"></p>
                                </div>
                                <div class="profile-field">
                                    <label for="username">Username <span class="required-mark">*</span></label>
                                    <input type="text" id="username" name="username" readonly required>
                                    <p class="field-error" data-error-for="username"></p>
                                </div>
                                <div class="profile-field">
                                    <label for="role">Role</label>
                                    <input type="text" id="role" name="role" readonly aria-readonly="true">
                                </div>
                                <div class="profile-field">
                                    <label for="email">Email <span class="required-mark">*</span></label>
                                    <input type="email" id="email" name="email" readonly required>
                                    <p class="field-error" data-error-for="email"></p>
                                </div>
                                <div class="profile-field">
                                    <label for="age">Age <span class="required-mark">*</span></label>
                                    <input type="number" id="age" name="age" min="1" max="130" readonly required>
                                    <p class="field-error" data-error-for="age"></p>
                                </div>
                                <div class="profile-field">
                                    <label for="gender">Gender <span class="required-mark">*</span></label>
                                    <select id="gender" name="gender" disabled required>
                                        <option value="">Select gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Prefer not to say">Prefer not to say</option>
                                    </select>
                                    <p class="field-error" data-error-for="gender"></p>
                                </div>
                                <div class="profile-field">
                                    <label for="position">Position <span class="required-mark">*</span></label>
                                    <input type="text" id="position" name="position" readonly required>
                                    <p class="field-error" data-error-for="position"></p>
                                </div>
                                <div class="profile-field profile-field-wide">
                                    <label for="phone_number">Phone Number <span class="required-mark">*</span></label>
                                    <input type="tel" id="phone_number" name="phone_number" readonly required>
                                    <p class="field-error" data-error-for="phone_number"></p>
                                </div>
                            </div>
                        </form>
                    </section>

                    <section class="profile-card" aria-labelledby="change-password-title">
                        <div class="section-header stacked-mobile">
                            <div>
                                <p class="section-eyebrow">Security</p>
                                <h2 id="change-password-title">Change Password</h2>
                                <p class="section-description">Use a strong password with a mix of uppercase, lowercase, and numbers.</p>
                            </div>
                        </div>

                        <div id="passwordAlert" class="form-alert hidden" role="alert"></div>

                        <form id="passwordForm" class="profile-form" novalidate>
                            <div class="profile-grid password-grid">
                                <div class="profile-field profile-field-wide">
                                    <label for="current_password">Current Password <span class="required-mark">*</span></label>
                                    <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
                                    <p class="field-error" data-error-for="current_password"></p>
                                </div>
                                <div class="profile-field">
                                    <label for="new_password">New Password <span class="required-mark">*</span></label>
                                    <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
                                    <p class="field-hint">Minimum 8 characters with uppercase, lowercase, and a number.</p>
                                    <p class="field-error" data-error-for="new_password"></p>
                                </div>
                                <div class="profile-field">
                                    <label for="confirm_password">Confirm Password <span class="required-mark">*</span></label>
                                    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
                                    <p class="field-error" data-error-for="confirm_password"></p>
                                </div>
                            </div>
                            <div class="password-actions">
                                <button id="change-password-button" class="action-button primary" type="submit">Change Password</button>
                            </div>
                        </form>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
