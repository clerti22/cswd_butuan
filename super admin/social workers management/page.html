<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCIMS Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <!-- Sidebar -->
        <style>
    .logout-modal-backdrop {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: rgba(7, 7, 12, 0.72);
        backdrop-filter: blur(4px);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.25s ease, visibility 0.25s ease;
        z-index: 1200;
    }

    .logout-modal-backdrop.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .logout-modal {
        width: min(100%, 420px);
        background: #ffffff;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 28px;
        padding: 2rem 1.75rem 1.5rem;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.38);
        text-align: center;
        color: #111827;
    }

    .logout-modal__icon-wrap {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(250, 204, 21, 0.42);
        background: radial-gradient(circle at center, rgba(250, 204, 21, 0.22), rgba(250, 204, 21, 0.08));
        box-shadow: inset 0 0 18px rgba(250, 204, 21, 0.08);
    }

    .logout-modal__icon {
        font-size: 1.8rem;
        color: #facc15;
        line-height: 1;
    }

    <div id="disableCodeModal" class="custom-modal" hidden>
        <div class="custom-modal-content custom-modal-compact" role="dialog" aria-modal="true"
            aria-labelledby="disableCodeTitle">
            <h2 id="disableCodeTitle">Disable Account</h2>
            <p class="custom-modal-subtitle">Enter secret code to continue.</p>
            <label for="secretCodeInput" class="info-label">Secret Code</label>
            <input type="password" id="secretCodeInput" class="info-input" autocomplete="off" />
            <p id="secretCodeError" class="modal-error" aria-live="polite"></p>
            <div class="custom-modal-actions">
                <button type="button" class="action-btn action-btn-secondary"
                    data-close-modal="disableCodeModal">Cancel</button>
                <button type="button" id="verifySecretCodeButton" class="action-btn action-btn-danger">Verify</button>
            </div>
        </div>
    </div>

    <div id="disableConfirmModal" class="custom-modal" hidden>
        <div class="custom-modal-content custom-modal-compact" role="dialog" aria-modal="true"
            aria-labelledby="disableConfirmTitle">
            <h2 id="disableConfirmTitle">Confirm Disable Account</h2>
            <p class="custom-modal-subtitle" id="disableConfirmMessage">Are you sure you want to disable this user's
                account?</p>
            <div class="custom-modal-actions">
                <button type="button" class="action-btn action-btn-secondary"
                    data-close-modal="disableConfirmModal">No</button>
                <button type="button" id="confirmDisableButton" class="action-btn action-btn-danger">Yes,
                    Disable</button>
            </div>
        </div>
    </div>

    <div id="showUserModal" class="custom-modal" hidden>
        <div class="custom-modal-content" role="dialog" aria-modal="true" aria-labelledby="showUserTitle">
            <div class="modal-logos">
                <img src="../images-logo/butuanseal.png" alt="Butuan seal">
                <h2 id="showUserTitle">User's Full Information</h2>
                <img src="../images-logo/cswd-logo.png" alt="CSWD logo">
            </div>

            <div class="user-details-grid">
                <div class="info-field">
                    <label class="info-label show-field-label">Full Name:</label>
                    <div class="info-input show-field-value" id="showFullName"></div>
                </div>
                <div class="info-field">
                    <label class="info-label show-field-label">Username:</label>
                    <div class="info-input show-field-value" id="showUsername"></div>
                </div>
                <div class="info-field">
                    <label class="info-label show-field-label" id="showAssignmentLabel">Division Assigned:</label>
                    <div class="info-input show-field-value" id="showAssignment"></div>
                </div>
                <div class="info-field">
                    <label class="info-label show-field-label">Phone Number:</label>
                    <div class="info-input show-field-value" id="showPhoneNumber"></div>
                </div>
                <div class="info-field">
                    <label class="info-label show-field-label">Gender:</label>
                    <div class="info-input show-field-value" id="showGender"></div>
                </div>
                <div class="info-field">
                    <label class="info-label show-field-label">Age:</label>
                    <div class="info-input show-field-value" id="showAge"></div>
                </div>
                <div class="info-field full-width">
                    <label class="info-label show-field-label">Role:</label>
                    <div class="info-input show-field-value" id="showRole"></div>
                </div>
                <div class="info-field full-width">
                    <label class="info-label show-field-label">Email:</label>
                    <div class="info-input show-field-value" id="showEmail"></div>
                </div>
            </div>

            <div class="custom-modal-actions custom-modal-actions-center">
                <button type="button" class="action-btn action-btn-danger"
                    data-close-modal="showUserModal">Close</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>


</body>

</html>
