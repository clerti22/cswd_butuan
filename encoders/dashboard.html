<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCIMS Encoder Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="overlay" id="overlay"></div>
  <div class="container">
    <nav class="sidebar" id="sidebar"></nav>
    <div class="main-content">
      <header class="topbar">
        <button class="menu-btn" id="openSidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
        <h2 class="topbar-title" style="font-weight: bold;">Dashboard</h2>
      </header>
      <main class="content">
        <section class="section">
          <h1 class="page-title">Current Status</h1>
          <div class="status-grid">
            <div class="status-card">
              <div class="status-card-head">Total Served Clients Today</div>
              <div class="status-card-body"><div class="status-left"><div class="big-icon"><i class="bi bi-check2-circle"></i></div></div><div class="status-value" id="todayTotal">0</div></div>
            </div>
            <div class="status-card">
              <div class="status-card-head">Total Served Clients - <span id="programLabel">Program</span></div>
              <div class="status-card-body"><div class="status-left"><div class="big-icon"><i class="bi bi-people-fill"></i></div></div><div class="status-value" id="programTotal">0</div></div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="table-panel">
            <div class="table-top-controls">
              <div class="table-switch"><button class="switch-btn active" type="button">Clients Table</button></div>
              <div class="search-actions">
                <input class="search-input" id="searchInput" type="text" placeholder="" />
                <button class="btn btn-search" id="btnSearch" type="button"><i class="bi bi-search"></i> Search</button>
              </div>
            </div>
            <div class="table-wrap"><table><thead><tr id="tableHeadRow"></tr></thead><tbody id="tableBody"></tbody></table></div>
          </div>
        </section>

        <section class="section">
          <div class="two-col">
            <div class="panel chart-panel"><h3 class="panel-title">Served Clients per Barangay</h3><div id="chartContainer"></div></div>
            <div class="right-stack">
              <div class="panel">
                <div class="panel-head-row notifications-head"><h3 class="panel-title">Notifications</h3><a class="see-all-link" id="seeAllNotifications" href="./../auth/notification.php" hidden>See All</a></div>
                <div id="recentActivities"></div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
