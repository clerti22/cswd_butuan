<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 1 - Membership Information Sheet</title>
    <link rel="stylesheet" href="form1.css">
</head>

<body>
    <main class="form-page">
        <header class="form-header">
            <img class="seal" src="../images-logo/butuanseal.png" alt="City of Butuan Seal">
            <div class="header-text">
                <p>Republic of the Philippines</p>
                <p class="header-strong">CITY GOVERNMENT OF BUTUAN</p>
                <p class="header-strong">City Social Welfare and Development Department</p>
                <p>City Hall Building, J.P. Rosales Ave., Doongan, Butuan City</p>
            </div>
            <img class="seal" src="../images-logo/cswd-logo.png" alt="CSWD Seal">
        </header>

        <section class="title-block">
            <h1>PAG-ASA YOUTH ASSOCIATION OF THE PHILIPPINES</h1>
            <h2>MEMBERSHIP INFORMATION SHEET</h2>
        </section>

        <section class="form-section">
            <div class="section-title">
                <span class="title-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.42 0-8 2-8 4.5V20h16v-1.5c0-2.5-3.58-4.5-8-4.5Z" />
                    </svg>
                </span>
                <span>Identifying Information</span>
            </div>

            <div class="form-grid">
                <label class="field">
                    <span>First Name:</span>
                    <input type="text">
                </label>
                <label class="field">
                    <span>Middle Name:</span>
                    <input type="text">
                </label>
                <label class="field">
                    <span>Last Name:</span>
                    <input type="text">
                </label>
                <label class="field">
                    <span>Suffix:</span>
                    <input type="text">
                </label>

                <label class="field">
                    <span>Date of Birth:</span>
                    <div class="input-icon">
                        <input type="text">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1.5A2.5 2.5 0 0 1 22 6.5v13A2.5 2.5 0 0 1 19.5 22h-15A2.5 2.5 0 0 1 2 19.5v-13A2.5 2.5 0 0 1 4.5 4H6V3a1 1 0 0 1 1-1Zm0 6H4v11.5a.5.5 0 0 0 .5.5h15a.5.5 0 0 0 .5-.5V8H7Z" />
                            </svg>
                        </span>
                    </div>
                </label>
                <label class="field">
                    <span>Place of Birth:</span>
                    <input type="text">
                </label>
                <label class="field">
                    <span>Nationality:</span>
                    <select>
                        <option></option>
                    </select>
                </label>
                <label class="field">
                    <span>Age:</span>
                    <input type="text">
                </label>

                <label class="field span-2">
                    <span>Address:</span>
                    <input type="text">
                </label>
                <label class="field">
                    <span>Religion:</span>
                    <input type="text">
                </label>
                <label class="field">
                    <span>Sex:</span>
                    <select>
                        <option></option>
                    </select>
                </label>

                <label class="field">
                    <span>In School Youth:</span>
                    <input type="text">
                </label>
                <label class="field">
                    <span>Out of School Youth:</span>
                    <input type="text">
                </label>
                <label class="field">
                    <span>Other Disadvantage Youth:</span>
                    <input type="text">
                </label>
                <label class="field">
                    <span>IP's:</span>
                    <input type="text">
                </label>

                <label class="field">
                    <span>Occupation:</span>
                    <input type="text">
                </label>
                <label class="field">
                    <span>Civil Status:</span>
                    <select>
                        <option></option>
                    </select>
                </label>
                <label class="field span-2">
                    <span>Contact Number:</span>
                    <input type="text">
                </label>

                <label class="field span-2">
                    <span>School Last Attended:</span>
                    <input type="text">
                </label>
                <label class="field span-2">
                    <span>Month &amp; Year:</span>
                    <div class="input-icon">
                        <input type="text">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1.5A2.5 2.5 0 0 1 22 6.5v13A2.5 2.5 0 0 1 19.5 22h-15A2.5 2.5 0 0 1 2 19.5v-13A2.5 2.5 0 0 1 4.5 4H6V3a1 1 0 0 1 1-1Zm0 6H4v11.5a.5.5 0 0 0 .5.5h15a.5.5 0 0 0 .5-.5V8H7Z" />
                            </svg>
                        </span>
                    </div>
                </label>

                <label class="field span-2">
                    <span>Trainings Attended:</span>
                    <input type="text">
                </label>
                <label class="field span-2">
                    <span>Skills/Interest/Hobbies:</span>
                    <input type="text">
                </label>
            </div>
        </section>
    </main>
</body>

</html>
