<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Form for Solo Parent</title>
    <link rel="stylesheet" href="soloparent.css" />
  </head>
  <body>
    <main class="form-sheet">
      <header class="form-header">
        <p class="form-header__line">Republic of the Philippines</p>
        <p class="form-header__line">Local Social Welfare and Development Office</p>
        <p class="form-header__line">City/Municipality,Region</p>
        <h1 class="form-header__title">APPLICATION FORM FOR SOLO PARENT</h1>
      </header>

      <section class="form-section">
        <div class="section-title">
          <span class="section-title__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
              <path
                d="M12 12.75a4.25 4.25 0 1 0-4.25-4.25A4.26 4.26 0 0 0 12 12.75Zm0 1.5c-3.65 0-6.75 1.88-6.75 4.25V20h13.5v-1.5c0-2.37-3.1-4.25-6.75-4.25Z"
                fill="currentColor"
              />
            </svg>
          </span>
          <h2>Identifying Information</h2>
        </div>

        <form class="form-grid">
          <div class="field">
            <label for="first-name">First Name:</label>
            <input id="first-name" type="text" />
          </div>
          <div class="field">
            <label for="middle-name">Middle Name:</label>
            <input id="middle-name" type="text" />
          </div>
          <div class="field">
            <label for="last-name">Last Name:</label>
            <input id="last-name" type="text" />
          </div>
          <div class="field">
            <label for="suffix">Suffix:</label>
            <input id="suffix" type="text" />
          </div>

          <div class="field">
            <label for="birth-date">Date of Birth:</label>
            <div class="input-icon">
              <input id="birth-date" type="date" />
            </div>
          </div>
          <div class="field field--span-2">
            <label for="birth-place">Place of Birth:</label>
            <input id="birth-place" type="text" />
          </div>
          <div class="field">
            <label for="age">Age:</label>
            <input id="age" type="text" />
          </div>

          <div class="field field--span-2">
            <label for="address">Address:</label>
            <input id="address" type="text" />
          </div>
          <div class="field">
            <label for="religion">Religion:</label>
            <input id="religion" type="text" />
          </div>
          <div class="field">
            <label for="sex">Sex:</label>
            <input id="sex" type="text" />
          </div>

          <div class="field field--span-2">
            <label for="education">Educational Attainment:</label>
            <input id="education" type="text" />
          </div>
          <div class="field">
            <label for="occupation">Occupation:</label>
            <input id="occupation" type="text" />
          </div>

          <div class="field">
            <label for="company">Company/Agency:</label>
            <input id="company" type="text" />
          </div>
          <div class="field">
            <label for="civil-status">Civil Status:</label>
            <select id="civil-status">
              <option value="" selected></option>
              <option>Single</option>
              <option>Married</option>
              <option>Separated</option>
              <option>Widowed</option>
            </select>
          </div>
          <div class="field field--span-2">
            <label>Employment Status:</label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="employment" />
                Employed
              </label>
              <label class="radio-option">
                <input type="radio" name="employment" />
                Self-Employed
              </label>
              <label class="radio-option">
                <input type="radio" name="employment" />
                Not - Employed
              </label>
            </div>
          </div>

          <div class="field">
            <label for="contact">Contact Number:</label>
            <input id="contact" type="text" />
          </div>
          <div class="field">
            <label for="income">Monthly Income:</label>
            <input id="income" type="text" />
          </div>
          <div class="field">
            <label for="philsy">Philsys Card Number:</label>
            <input id="philsy" type="text" />
          </div>

          <div class="field field--span-4">
            <label for="email">Email Address:</label>
            <input id="email" type="email" />
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
