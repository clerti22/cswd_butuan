        <div class="main-content">
            <header class="topbar">
                <button class="menu-btn" id="openSidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                    </svg>

                <h2 class="topbar-title">Social Workers Management</h2>
            </header>

            <main class="content" id="mainDiv">
                <div class="tabs" style="margin-bottom: 1em;">
                    <button class="tab active" data-tab="tab1">Admins/Divisions</button>
                    <button class="tab" data-tab="tab2">Encoders/Programs</button>
                </div>


                <div id="tabContent"></div>
                <script>
                    const tabs = document.querySelectorAll(".tab");
                    const tabContent = document.getElementById("tabContent");

                    tabs.forEach(tab => {
                        tab.addEventListener("click", () => {

                            // Toggle active tab
                            tabs.forEach(t => t.classList.remove("active"));
                            tab.classList.add("active");

                          
                            tabContent.innerHTML = "";

                            if (tab.dataset.tab === "tab1") {
                                renderAdmins();
                            } else {
                                renderEncoders();
                            }
                        });
                    });
                    function renderAdmins() {

                        const controls = createAdmin("+ Add Admin");
                        tabContent.appendChild(controls);

                        const headers = ["First Name", "Middle Name", "Last Name", "Division", "Status", "Action"];
                        const rows = [
                            ["Tony", "A.", "Stark", "DPSD", "active", "Active"],
                            ["Bruce", "O.", "Banner", "DPSD", "offline", "Offline"],
                            ["Dwayne", "", "Johnson", "DPSD", "disabled", "Disabled Account"],
                            ["John", "K.", "Cena", "DPSD", "disabled", "Disable Account"]
                        ];

                        tabContent.appendChild(createTable(headers, rows));
                    }

             
                    function renderEncoders() {

                        const controls = createEncoder("+ Add Encoder");
                        tabContent.appendChild(controls);

                        const headers = ["First Name", "Middle Name", "Last Name", "Programs", "Status", "Action"];
                        const rows = [
                            ["Tony", "A.", "Stark", "Program A", "active", "Active"],
                            ["Bruce", "O.", "Banner", "Program B", "offline", "Offline"],
                            ["Dwayne", "", "Johnson", "Program C", "disabled", "Disabled Account"]
                        ];

                        tabContent.appendChild(createTable(headers, rows));
                    }

                   
                    function createAdmin(addText) {
                        const controls = document.createElement("div");
                        controls.className = "controls";
                        controls.style.background = "white";
                        controls.style.padding = "1.5em";
                        controls.style.borderRadius = "0.5em";

                        const input = document.createElement("input");
                        input.className = "search-input";

                        const searchBtn = document.createElement("button");
                        searchBtn.className = "btn btn-search";
                        searchBtn.style.background = "#008B10";
                        searchBtn.textContent = "🔍 Search";

                        const addBtn = document.createElement("a");
                        addBtn.className = "btn btn-add";
                        addBtn.style.background = "#008B10";
                        addBtn.style.textDecoration = 'none';
                        addBtn.textContent = addText;
                        addBtn.href = 'addadmin.html'

                        const filterBtn = document.createElement("button");
                        filterBtn.className = "btn btn-filter";
                        filterBtn.style.background = "#008B10";
                        filterBtn.textContent = "▼ Filter";

                        controls.append(input, searchBtn, addBtn, filterBtn);
                        return controls;
                    }

               
                    function createTable(headers, rows) {

                        const box = document.createElement("div");
                        box.className = "content-box";

                        const table = document.createElement("table");

                        const thead = document.createElement("thead");
                        const trHead = document.createElement("tr");

                        headers.forEach(h => {
                            const th = document.createElement("th");
                            th.textContent = h;
                            trHead.appendChild(th);
                        });

                        thead.appendChild(trHead);

                        const tbody = document.createElement("tbody");

                        rows.forEach(row => {
                            const tr = document.createElement("tr");

                            for (let i = 0; i < 4; i++) {
                                const td = document.createElement("td");
                                td.textContent = row[i];
                                tr.appendChild(td);
                            }

                            // STATUS
                            const statusTd = document.createElement("td");
                            const statusDiv = document.createElement("div");
                            statusDiv.className = "status";

                            const dot = document.createElement("span");
                            dot.className = `status-dot ${row[4]}`;

                            const text = document.createElement("span");
                            text.textContent = row[5];

                            statusDiv.append(dot, text);
                            statusTd.appendChild(statusDiv);
                            tr.appendChild(statusTd);

                            // ACTIONS
                            const actionTd = document.createElement("td");
                            const actions = document.createElement("div");
                            actions.className = "actions";

                            ["Edit", "Delete", "Show"].forEach(a => {
                                const btn = document.createElement("button");
                                btn.className = `btn-${a.toLowerCase()}`;
                                btn.textContent = a;
                                actions.appendChild(btn);
                            });

                            actionTd.appendChild(actions);
                            tr.appendChild(actionTd);

                            tbody.appendChild(tr);
                        });

                        table.append(thead, tbody);
                        box.appendChild(table);

                        return box;
                    }

                    function createEncoder(addText) {
                        const controls = document.createElement("div");
                        controls.className = "controls";
                        controls.style.background = "white";
                        controls.style.padding = "1.5em";
                        controls.style.borderRadius = "0.5em";

                        const input = document.createElement("input");
                        input.className = "search-input";

                        const searchBtn = document.createElement("button");
                        searchBtn.className = "btn btn-search";

                        const addBtn = document.createElement("a");

                        addBtn.textContent = addText;
                        addBtn.href = 'addencoder.html'

                        const filterBtn = document.createElement("button");
                        filterBtn.className = "btn btn-filter";
                        filterBtn.style.background = "#008B10";
                        filterBtn.textContent = "▼ Filter";

                        controls.append(input, searchBtn, addBtn, filterBtn);
                        return controls;
                    }

               
                    function createTable(headers, rows) {

                        const box = document.createElement("div");
                        box.className = "content-box";

                        const table = document.createElement("table");

                        const thead = document.createElement("thead");
                        const trHead = document.createElement("tr");

                        headers.forEach(h => {
                            const th = document.createElement("th");
                            th.textContent = h;
                            trHead.appendChild(th);
                        });

                        thead.appendChild(trHead);

                        const tbody = document.createElement("tbody");

                        rows.forEach(row => {
                            const tr = document.createElement("tr");

                            for (let i = 0; i < 4; i++) {
                                const td = document.createElement("td");
                                td.textContent = row[i];
                                tr.appendChild(td);
                            }

                            // STATUS
                            const statusTd = document.createElement("td");
                            const statusDiv = document.createElement("div");
                            statusDiv.className = "status";

                            const dot = document.createElement("span");
                            dot.className = `status-dot ${row[4]}`;

                            const text = document.createElement("span");
                            text.textContent = row[5];

                            statusDiv.append(dot, text);
                            statusTd.appendChild(statusDiv);
                            tr.appendChild(statusTd);

                            // ACTIONS
                            const actionTd = document.createElement("td");
                            const actions = document.createElement("div");
                            actions.className = "actions";

                            ["Edit", "Delete", "Show"].forEach(a => {
                                const btn = document.createElement("button");
                                btn.className = `btn-${a.toLowerCase()}`;
                                btn.textContent = a;
                                actions.appendChild(btn);
                            });

                            actionTd.appendChild(actions);
                            tr.appendChild(actionTd);

                            tbody.appendChild(tr);
                        });

                        table.append(thead, tbody);
                        box.appendChild(table);

                        return box;
                    }


                </script>

                    dataPoints: [

                        { label: "OSCA/PDAO", y: 420 },
                        { label: "DPSD", y: 970 }
                    ],
                    color: "#6f42c1"
                }]
            });
            chart.render();
